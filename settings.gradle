pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

plugins {
    id 'fabric-loom' version "${fabric_loom_version}" apply false
    id 'io.github.Akfz.jnih' version "1.0.0" apply false
    //id 'net.neoforged.moddev' version "${neoforge_gradle_version}" apply false
}

rootProject.name = hasProperty('mod_name') ? mod_name : 'Template'
def mcVersion = minecraft_version

def isVersionAtLeast = { String current, String target ->
    def c = current.split(/[-_.]/).collect { it.replaceAll('\\D', '').toInteger() }
    def t = target.split(/[-_.]/).collect { it.replaceAll('\\D', '').toInteger() }

    while (c.size() < 3) c << 0
    while (t.size() < 3) t << 0

    for (int i = 0; i < 3; i++) {
        if (c[i] != t[i]) {
            return c[i] > t[i]
        }
    }
    return true
}

include 'fabric'
include 'forge'
if (isVersionAtLeast(mcVersion, '1.20.4')) {
    include 'neoforge'
}
include 'common'