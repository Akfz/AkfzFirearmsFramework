pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    plugins {
        id 'fabric-loom'                              version providers.gradleProperty('fabric_loom_version')
        id 'net.minecraftforge.gradle'                version providers.gradleProperty('forge_gradle_version')
        id 'net.neoforged.moddev'                     version providers.gradleProperty('neoforge_gradle_version')
        id 'org.parchmentmc.librarian.forgegradle'    version providers.gradleProperty('parchment_librarian_version')
    }
}

rootProject.name = 'AFF'