plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        def pMc = project.findProperty('parchment_mc_version') ?: project.minecraft_version
        def pVer = project.findProperty('parchment_version') ?: ''
        if (pVer) {
            parchment("org.parchmentmc.data:parchment-${pMc}:${pVer}@zip")
        }
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1"

    def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'
    modCompileOnly "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${project.findProperty('mixin_name') ?: project.mod_id}.refmap.json"
    }

    runs {
        client {
            client()
            runDir "run"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = rootProject.ext.find('modProperties') ?: [:]
    inputs.properties props

    filesMatching('**/*.json') {
        expand props
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('jar', Jar).configure {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-fabric-dev.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))

    duplicatesStrategy = DuplicatesStrategy.WARN

    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : project.maven_group,
                'Specification-Version'   : project.mod_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : project.maven_group,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).configure {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-fabric.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))

    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.WARN

    if (file("LICENSE").exists()) {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-AmodLoaderTarget=fabric"
}