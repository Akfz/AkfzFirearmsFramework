plugins {
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
    id 'org.spongepowered.mixin'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    flatDir {
        dirs 'libs'
    }
}

minecraft {
    def pVer = project.findProperty('parchment_version') ?: '2023.09.03'
    def pMc = project.findProperty('parchment_mc_version') ?: project.minecraft_version
    mappings channel: 'parchment', version: "${pVer}-${pMc}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.earlydisplay.enable', 'false'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
        client {
            property 'mixin.config', "${mixinConfigName}.json"
        }

        server {
            property 'mixin.config', "${mixinConfigName}.json"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"

    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"

    def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'

    embed "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
    //implementation files('../libs/Visor-0.5.0beta2+mc1.20.1-forge.jar')
}

mixin {
    def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
    add sourceSets.main, "${mixinConfigName}.refmap.json"
    config "${mixinConfigName}.json"
}

tasks.named('processResources', ProcessResources).configure {
    def props = rootProject.ext.find('modProperties') ?: [:]
    inputs.properties props

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '**/*.json']) {
        expand props
    }

    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.named('jar', Jar).configure {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-forge.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.WARN

    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.maven_group,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : project.maven_group,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mixinConfigName}.json"
        ])
    }
}

tasks.register('devJar', Jar) {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-forge-dev.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.WARN

    from sourceSets.main.output

    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.maven_group,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : project.maven_group,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mixinConfigName}.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-AmodLoaderTarget=forge"
}